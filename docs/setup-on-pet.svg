<svg xmlns="http://www.w3.org/2000/svg" width="840" height="348" viewBox="0 0 840 348" role="img" aria-labelledby="title desc">
  <title id="title">Find the pet's phone setup screen</title>
  <desc id="desc">With the mic off, tap the gear at top right, then Phone setup. Scan the QR on your actual pet, not this illustration. If needed, open 192.168.4.1 after joining the setup Wi-Fi.</desc>
  <rect width="840" height="348" rx="16" fill="#eaf2fc"/>
  <g font-family="sans-serif" text-anchor="middle">
    <g fill="#0f172a" font-size="22" font-weight="700">
      <text x="146" y="38">1. Tap the gear</text>
      <text x="420" y="38">2. Tap Phone setup</text>
      <text x="694" y="38">3. Join setup Wi-Fi</text>
    </g>
    <g fill="#0f172a" stroke="#334155" stroke-width="4">
      <rect x="42" y="55" width="208" height="247" rx="16"/>
      <rect x="316" y="55" width="208" height="247" rx="16"/>
      <rect x="590" y="55" width="208" height="247" rx="16"/>
    </g>
    <g fill="#f1f5f9" font-size="19" font-weight="700">
      <text x="140" y="86" font-size="12">Amplifier Assistant</text>
      <text x="420" y="86">Settings</text>
      <text x="694" y="86">Connect your phone</text>
    </g>
    <g transform="translate(224 80)">
      <circle r="14" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
      <path d="m-2-9 4 0 1 3 3 1 2-1 2 4-2 2 0 2 2 2-2 4-2-1-3 1-1 3-4 0-1-3-3-1-2 1-2-4 2-2 0-2-2-2 2-4 2 1 3-1z" transform="scale(.8)" fill="#f8fafc"/>
      <circle r="2.5" fill="#0f172a"/>
    </g>
    <text x="146" y="114" fill="#cbd5e1" font-size="15">Let's get connected</text>
    <rect x="82" y="140" width="128" height="67" rx="10" fill="#172b46"/>
    <text x="146" y="179" fill="#b5d9fa" font-size="16">Animated pet</text>
    <g transform="translate(146 250)">
      <circle r="19" fill="#f1f5f9"/>
      <rect x="-3" y="-10" width="6" height="11" rx="3" fill="#0f172a"/>
      <path d="M-7-2a7 7 0 0 0 14 0M0 5v5m-4 0h8" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
      <path d="m-10-10 20 20" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <text x="146" y="285" fill="#f1f5f9" font-size="14">Mic off - tap to talk</text>
    <g fill="#cbd5e1" font-size="14">
      <text x="420" y="115">Voice: mic off</text>
      <text x="694" y="109" font-size="10">Scan to join Amplifier Assistant Wi-Fi</text>
      <text x="694" y="128">Firmware 0.3.19-amoled-boot</text>
    </g>
    <g fill="#38bdf8">
      <rect x="341" y="131" width="158" height="30" rx="8" stroke="#fbbf24" stroke-width="3"/>
      <rect x="341" y="174" width="158" height="29" rx="8"/>
      <rect x="341" y="216" width="158" height="29" rx="8"/>
      <rect x="341" y="262" width="158" height="26" rx="8"/>
      <rect x="623" y="262" width="142" height="26" rx="8"/>
    </g>
    <g fill="#0f172a" font-size="15" font-weight="700">
      <text x="420" y="151">Phone setup</text>
      <text x="420" y="194">Volume</text>
      <text x="420" y="236">Touch alignment</text>
      <text x="420" y="281" font-size="11">Back to Amplifier Assistant</text>
      <text x="694" y="281">Back / Done</text>
    </g>
    <rect x="647" y="140" width="94" height="84" rx="6" fill="#f1f5f9"/>
    <rect x="655" y="148" width="78" height="68" rx="4" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4"/>
    <g fill="#0f172a" font-size="15" font-weight="700"><text x="694" y="178">QR on</text><text x="694" y="198">your pet</text></g>
    <text x="694" y="247" fill="#f1f5f9" font-size="16">Open 192.168.4.1</text>
    <g fill="#075985" font-size="26" font-weight="700"><text x="283" y="187">→</text><text x="557" y="187">→</text></g>
    <text x="420" y="329" fill="#334155" font-size="16">Illustration · Use the real QR and setup password on your pet.</text>
  </g>
</svg>
